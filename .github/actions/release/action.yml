name: Releasing APK files
runs:
  using: "composite"
  steps:
    - name: Generate release info
      shell: bash
      run: |
        echo "
        # ⚡ Morphe Automated Builds

        **Curated, Ad-Free & Enhanced Android Apps built clean with the Morphe patching engine.**
        Visit [README.md](../main/README.md) for full app features, installation prerequisites, and architecture downloads.

        ### 🧩 Upstream Patch Engines
        - **[Morphe Patches](https://github.com/MorpheApp/morphe-patches/releases)** (YouTube, YouTube Music, Reddit)
        - **[Piko MPP](https://github.com/crimera/piko/releases)** (Instagram)
        - **[Gboard Patches](https://github.com/jasonwu1994/Gboard-patches/releases)** (Google Keyboard)
        - **[MicroG RE](https://github.com/MorpheApp/MicroG-RE/releases)** (GMS Core Provider)
        "> ${{ github.workspace }}-CHANGELOG.txt
    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: Morphe Automated Builds
        tag: all
        bodyFile: ${{ github.workspace }}-CHANGELOG.txt
        allowUpdates: true
