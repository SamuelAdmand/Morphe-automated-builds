name: 1. Manual Patch
permissions: write-all
env:
  repository: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app do you want to patch? (All = 1, 2, 3, 4)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'youtube'
          - 'reddit'
          - 'youtube-music'
          - 'instagram'
  workflow_call:
    inputs:
      app:
        required: false
        type: string
        default: 'all'

jobs:
  patch_morphe:
    name: Patch Morphe Apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - name: Determine if step should run
        id: filter
        run: |
          target="${{ inputs.app || github.event.inputs.app || 'all' }}"
          idx="${{ matrix.run }}"
          should_run="true"
          if [ "$target" = "youtube" ] && [ "$idx" != "1" ]; then should_run="false"; fi
          if [ "$target" = "reddit" ] && [ "$idx" != "2" ]; then should_run="false"; fi
          if [ "$target" = "youtube-music" ] && [ "$idx" != "3" ]; then should_run="false"; fi
          if [ "$target" = "instagram" ] && [ "$idx" != "4" ]; then should_run="false"; fi
          echo "should_run=$should_run" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v6.0.2

      - name: Preparing to patch
        if: steps.filter.outputs.should_run == 'true'
        uses: ./.github/actions/preparing

      - name: Check github connection
        if: steps.filter.outputs.should_run == 'true'
        id: check-gh-morphe
        run: bash src/etc/connection.sh

      - name: Patch apk
        id: patch-morphe
        if: steps.filter.outputs.should_run == 'true' && steps.check-gh-morphe.outputs.internet_error == '0'
        run: bash src/build/morphe.sh ${{ matrix.run }}

      - name: Releasing APK files
        id: release-morphe
        if: steps.filter.outputs.should_run == 'true' && steps.check-gh-morphe.outputs.internet_error == '0'
        uses: ./.github/actions/release

      - name: Update README with build timestamp
        if: steps.filter.outputs.should_run == 'true' && steps.check-gh-morphe.outputs.internet_error == '0'
        shell: bash
        run: |
          idx="${{ matrix.run }}"
          app_name=""
          if [ "$idx" = "1" ]; then app_name="youtube"; fi
          if [ "$idx" = "2" ]; then app_name="reddit"; fi
          if [ "$idx" = "3" ]; then app_name="youtube-music"; fi
          if [ "$idx" = "4" ]; then app_name="instagram"; fi

          if [ -n "$app_name" ]; then
            python3 src/etc/update_readme_timestamp.py "$app_name"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for i in {1..5}; do
              git pull --rebase origin main || true
              if git diff --quiet README.md; then
                echo "[*] No README changes to commit."
                break
              fi
              git add README.md
              git commit -m "chore(readme): update build timestamp for $app_name [skip ci]" || break
              if git push origin main; then
                echo "[+] Successfully pushed README timestamp for $app_name"
                break
              fi
              sleep $(( (RANDOM % 5) + 2 ))
            done
          fi

