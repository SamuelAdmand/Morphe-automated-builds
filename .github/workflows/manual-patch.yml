name: 1. Manual Patch
permissions: write-all
env:
  repository: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app do you want to patch? (All = 1, 2, 3, 4, 5)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'youtube'
          - 'reddit'
          - 'youtube-music'
          - 'instagram'
          - 'gboard'
  workflow_call:
    inputs:
      app:
        required: false
        type: string
        default: 'all'

jobs:
  patch_morphe:
    name: Patch Morphe Apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - name: Determine if step should run
        id: filter
        run: |
          target="${{ inputs.app || github.event.inputs.app || 'all' }}"
          idx="${{ matrix.run }}"
          should_run="true"
          if [ "$target" = "youtube" ] && [ "$idx" != "1" ]; then should_run="false"; fi
          if [ "$target" = "reddit" ] && [ "$idx" != "2" ]; then should_run="false"; fi
          if [ "$target" = "youtube-music" ] && [ "$idx" != "3" ]; then should_run="false"; fi
          if [ "$target" = "instagram" ] && [ "$idx" != "4" ]; then should_run="false"; fi
          if [ "$target" = "gboard" ] && [ "$idx" != "5" ]; then should_run="false"; fi
          echo "should_run=$should_run" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v6.0.2

      - name: Preparing to patch
        if: steps.filter.outputs.should_run == 'true'
        uses: ./.github/actions/preparing

      - name: Check github connection
        if: steps.filter.outputs.should_run == 'true'
        id: check-gh-morphe
        run: bash src/etc/connection.sh

      - name: Patch apk
        id: patch-morphe
        if: steps.filter.outputs.should_run == 'true' && steps.check-gh-morphe.outputs.internet_error == '0'
        run: bash src/build/morphe.sh ${{ matrix.run }}

      - name: Releasing APK files
        id: release-morphe
        if: steps.filter.outputs.should_run == 'true' && steps.check-gh-morphe.outputs.internet_error == '0'
        uses: ./.github/actions/release

      - name: Update README with build metadata
        if: steps.filter.outputs.should_run == 'true' && steps.check-gh-morphe.outputs.internet_error == '0'
        shell: bash
        run: |
          idx="${{ matrix.run }}"
          app_name=""
          if [ "$idx" = "1" ]; then app_name="youtube"; fi
          if [ "$idx" = "2" ]; then app_name="reddit"; fi
          if [ "$idx" = "3" ]; then app_name="youtube-music"; fi
          if [ "$idx" = "4" ]; then app_name="instagram"; fi
          if [ "$idx" = "5" ]; then app_name="gboard"; fi

          if [ -n "$app_name" ]; then
            meta_file="./release/metadata/$app_name.env"
            app_ver=""
            patch_ver=""
            if [ -f "$meta_file" ]; then
              # shellcheck disable=SC1090
              source "$meta_file"
              app_ver="${APP_VERSION:-}"
              patch_ver="${PATCH_VERSION:-}"
            fi

            args=("$app_name")
            if [ -n "$app_ver" ]; then
              args+=(--app-version "$app_ver")
            fi
            if [ -n "$patch_ver" ]; then
              args+=(--patch-version "$patch_ver")
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            for i in {1..10}; do
              git fetch origin main
              git reset --hard origin/main
              python3 src/etc/update_readme_timestamp.py "${args[@]}"
              if git diff --quiet README.md; then
                echo "[*] No README changes needed for $app_name."
                break
              fi
              git add README.md
              if git commit -m "chore(readme): update build metadata for $app_name [skip ci]"; then
                if git push origin main; then
                  echo "[+] Successfully pushed README metadata for $app_name"
                  break
                fi
              fi
              echo "[!] Push collision detected for $app_name, retrying ($i/10)..."
              sleep $(( (RANDOM % 8) + 3 ))
            done
          fi

